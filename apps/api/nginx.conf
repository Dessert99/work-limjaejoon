# 변환 요청에는 많은 연결이 필요하지 않으므로 중계 작업자 하나만 유지한다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    # API를 다시 만들 때 컨테이너 주소가 바뀌어도 Docker DNS에서 새 주소를 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 작업 주소는 결과를 받을 수 있는 비밀값이므로 접근 로그에 기록하지 않는다.
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # 이 포트는 호스트의 localhost로만 열고 외부 요청은 Cloudflare Tunnel로 받는다.
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        "" $remote_addr;
    }

    server {
        listen 3101;
        client_max_body_size 91m;
        client_body_timeout 120s;

        location / {
            set $api_upstream http://api:3101;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # 클라이언트가 보낸 임의의 전달 체인을 이어 붙이지 않는다.
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            # 업로드와 다운로드를 중계 디스크에 보관하지 않고 바로 흘려보낸다.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
        }
    }
}
