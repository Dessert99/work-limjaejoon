# 로컬에서 실행할 컨테이너를 정의한다.
services:
  # 프론트는 pnpm dev로 실행하고 API만 컨테이너로 실행한다.
  api:
    # 모노레포 루트의 잠금 파일을 포함해 API 이미지를 빌드한다.
    build:
      # Dockerfile의 COPY 기준 경로를 프로젝트 루트로 지정한다.
      context: .
      # API 전용 이미지 정의를 사용한다.
      dockerfile: apps/api/Dockerfile
    # 자식 프로세스를 회수하고 종료 신호를 전달한다.
    init: true
    # Docker가 시작된 뒤 API를 복구하고 명시적으로 중지한 경우에는 그대로 둔다.
    restart: unless-stopped
    # 중계가 API 준비 전에 연결을 보내지 않도록 컨테이너 안에서 상태를 확인한다.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3101/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 변환 문서가 외부 참조로 홈 네트워크나 인터넷에 접근하지 못하게 한다.
    networks:
      - processing
    # 원본과 결과는 /tmp에만 쓰고 실행 이미지에는 기록하지 않는다.
    read_only: true
    # 외부 처리 프로그램에 불필요한 커널 권한과 권한 상승을 허용하지 않는다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 변환 프로그램의 프로세스 폭증과 호스트 자원 독점을 제한한다.
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    # 서버 실행에 필요한 환경변수를 전달한다.
    environment:
      # 컨테이너 내부 API 수신 포트로 포트 매핑과 일치해야 한다.
      PORT: '3101'
      # 운영 서버에서는 실제 화면 주소를 환경변수로 지정한다.
      FRONTEND_ORIGIN: '${FRONTEND_ORIGIN:-http://localhost:3100}'
      # 내부망의 Nginx만 API에 접근하며 전달 헤더는 Nginx가 새로 작성한다.
      TRUST_PROXY: '1'
      # 임시 경로를 참조하는 프로그램이 메모리 디스크를 사용하게 한다.
      TMPDIR: /tmp
      # 합의한 10분 보관 정책을 기본으로 적용한다.
      RESULT_TTL_SECONDS: '${RESULT_TTL_SECONDS:-600}'
      # 무거운 작업의 IP당 시간당 요청 상한도 운영자가 명시한다.
      PDF_RATE_LIMIT: '${PDF_RATE_LIMIT:-}'
      DOCUMENT_RATE_LIMIT: '${DOCUMENT_RATE_LIMIT:-}'
      # 실제 파일 품질을 확인하기 전까지 한글 문서 변환은 실험 기능으로 제공한다.
      HWP_EXPERIMENTAL_ENABLED: '${HWP_EXPERIMENTAL_ENABLED:-1}'
      # 네이티브 이미지 처리와 변환 프로그램이 작업마다 스레드를 늘리지 않게 한다.
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
    # 임시 파일 경로를 컨테이너 디스크 대신 메모리 파일시스템에 둔다.
    tmpfs:
      # /tmp 전체의 크기를 1GiB로 제한하고 일반 사용자도 임시 파일을 만들 수 있게 한다.
      - /tmp:size=1g,mode=1777
  # 외부 연결을 맡는 작은 중계만 호스트 포트를 열고 API는 내부망에 남겨 둔다.
  gateway:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ingress
      - processing
    ports:
      - '127.0.0.1:${API_PORT:-3101}:3101'
    # 중계도 관리자 권한과 파일 시스템 기록 없이 실행한다.
    user: nginx
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./apps/api/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
# API의 외부 통신은 차단하고 중계만 두 네트워크를 연결한다.
networks:
  ingress: {}
  processing:
    internal: true
